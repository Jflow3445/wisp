services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nister_commerce
      POSTGRES_USER: nister
      POSTGRES_PASSWORD: nister
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nister -d nister_commerce"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - commerce-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - commerce-redis:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: nister
      MINIO_ROOT_PASSWORD: nister-local-only
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - commerce-minio:/data

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "59200:9200"
    volumes:
      - commerce-opensearch:/usr/share/opensearch/data

volumes:
  commerce-postgres:
  commerce-redis:
  commerce-minio:
  commerce-opensearch:
