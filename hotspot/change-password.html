<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NISTER Wi-Fi | Change Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="common.css">
  <style>
    .card{max-width:560px}
    .note-box{
      background:rgba(15,118,110,.08);
      border:1px solid rgba(15,118,110,.2);
      color:#0b3c36;
      border-radius:12px;
      padding:10px 12px;
      font-size:12px;
      margin:10px 0 14px;
    }
  </style>
  <script>
    function qs(k){ return new URLSearchParams(location.search).get(k) || ''; }
    function bindToggle(btnId, inputId){
      var btn = document.getElementById(btnId);
      var input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener('click', function(){
        var isPass = input.type === 'password';
        input.type = isPass ? 'text' : 'password';
        btn.textContent = isPass ? 'Hide' : 'Show';
        btn.setAttribute('aria-pressed', isPass ? 'true' : 'false');
      });
    }
    function showBanner(text){
      var box = document.getElementById('banner');
      var span = document.getElementById('banner-text');
      if (!box || !span) return;
      span.textContent = text || '';
      box.style.display = text ? 'block' : 'none';
    }
    function validateForm(e){
      var user = (document.getElementById('user').value || '').trim();
      var cur = (document.getElementById('current').value || '').trim();
      var p1 = (document.getElementById('pass').value || '').trim();
      var p2 = (document.getElementById('pass2').value || '').trim();
      if (!user){
        showBanner('Account not found. Open this page from the status screen.');
        if (e && e.preventDefault) e.preventDefault();
        return false;
      }
      if (!cur){
        showBanner('Please enter your current password.');
        if (e && e.preventDefault) e.preventDefault();
        return false;
      }
      if (!p1 || !p2){
        showBanner('Please enter and confirm your new password.');
        if (e && e.preventDefault) e.preventDefault();
        return false;
      }
      if (p1 !== p2){
        showBanner('Passwords do not match. Please try again.');
        if (e && e.preventDefault) e.preventDefault();
        return false;
      }
      return true;
    }
    document.addEventListener('DOMContentLoaded', function(){
      var rawUser = qs('username') || '$(username)' || '';
      if (rawUser.indexOf('$(') !== -1) rawUser = '';
      var userEl = document.getElementById('user');
      var display = document.getElementById('account_display');
      if (userEl) userEl.value = rawUser;
      if (display) display.textContent = rawUser || 'Not available';
      if (!rawUser){
        showBanner('Account not found. Open this page from the status screen.');
        var btn = document.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
      }
      var mac = qs('mac') || '$(mac)';
      document.getElementById('mac').value = mac;
      bindToggle('toggle_current', 'current');
      bindToggle('toggle_pass', 'pass');
      bindToggle('toggle_pass2', 'pass2');
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <div class="dot"></div>
        <div class="name">NISTER Wi-Fi</div>
        <span class="tag">security</span>
      </div>
      <h2 class="h">Change your password</h2>
      <p class="sub">Update your Wi-Fi password securely.</p>

      <div class="note-box">This will update the password for your account.</div>

      <div id="banner" class="banner err"><span id="banner-text"></span></div>

      <form action="https://api.nister.org/hotspot/change_password.php" data-api-path="/hotspot/change_password.php" method="post" target="_top" autocomplete="off" onsubmit="return validateForm(event)">
        <label class="small">Account</label>
        <div class="input" id="account_display" style="background:#fffdfa">...</div>
        <div style="height:10px"></div>

        <label class="small" for="current">Current password *</label>
        <div class="input-wrap">
          <input id="current" name="current_password" class="input" type="password" autocomplete="current-password" required>
          <button class="toggle-btn" id="toggle_current" type="button" aria-pressed="false">Show</button>
        </div>
        <div style="height:10px"></div>

        <label class="small" for="pass">New password *</label>
        <div class="input-wrap">
          <input id="pass" name="password" class="input" type="password" autocomplete="new-password" required>
          <button class="toggle-btn" id="toggle_pass" type="button" aria-pressed="false">Show</button>
        </div>
        <div style="height:10px"></div>

        <label class="small" for="pass2">Confirm password *</label>
        <div class="input-wrap">
          <input id="pass2" name="password2" class="input" type="password" autocomplete="new-password" required>
          <button class="toggle-btn" id="toggle_pass2" type="button" aria-pressed="false">Show</button>
        </div>
        <div style="height:16px"></div>

        <input type="hidden" id="user" name="username" value="$(username)">
        <input type="hidden" id="mac" name="mac" value="$(mac)">
        <input type="hidden" id="link_login_only" name="link_login_only" value="$(link-login-only)">

        <button class="btn btn-primary btn-full" type="submit">Update password</button>
      </form>

      <hr>
      <div class="center small">Remembered it? <a class="link" href="login.html">Return to login</a></div>
      <div class="support">
        <a class="support-link" href="https://wa.me/233598544768" target="_blank" rel="noopener">WhatsApp support</a>
        <span class="note">If you are stuck, chat with us.</span>
      </div>
      <div class="footer">Keep your password safe and do not share it.</div>
    </div>
  </div>
</body>
<script src="config.js"></script>
</html>
