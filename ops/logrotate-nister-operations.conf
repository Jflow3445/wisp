# Operational text logs only. Never match NetFlow capture files or RADIUS detail.
/var/log/nister/account-queue-sync.log
/var/log/nister/alerts.log
/var/log/nister/auto_renew.log
/var/log/nister/marketing_sweep.log
/var/log/nister/mikrotik_guard.log
/var/log/nister/netflow_drive_archive.log
/var/log/nister/paystack_reconcile.log
/var/log/nister/tunnel_watchdog.log
{
    daily
    rotate 90
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    create
}

/var/log/freeradius/nister-quota-exec.err
{
    daily
    rotate 90
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
