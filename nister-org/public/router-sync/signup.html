<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NISTER Wi-Fi | Create an account</title><link rel="stylesheet" href="common.css?v=20261103">
<style>.card{max-width:520px}[hidden]{display:none!important}.signup-hint{font-size:12px;line-height:1.7;color:#52615c;margin:9px 0}.signup-otp{display:flex;gap:8px;align-items:center}.signup-otp .input{flex:1;min-width:0}.signup-secondary{min-height:42px;padding:8px 14px;border:1px solid #b9d2c4;border-radius:9px;background:white;color:#0f766e;cursor:pointer}fieldset{border:1px solid #d4dfd5;border-radius:12px;padding:14px;margin:15px 0}legend{font-size:12px;color:#365847}form>label{display:block;margin:17px 0 8px}.signup-password{position:relative}.signup-password input{padding-right:65px}.signup-password button{position:absolute;right:8px;top:8px;border:0;background:transparent;color:#0f766e;padding:7px;cursor:pointer}.signup-referral{margin:20px 0;font-size:12px}.signup-referral summary{cursor:pointer;color:#0f766e}.signup-referral label{display:block;margin:10px 0}.signup-trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}.banner.is-success{background:#edf7f0;color:#225b3d}.signup-secondary:disabled{opacity:.55}</style>
<script src="config.js" defer></script><script src="signup.js?v=20261103" defer></script></head><body><div class="container"><div class="card">
<div class="logo"><div class="dot"></div><div class="name">NISTER Wi-Fi</div></div>
<h1 class="h">Create your account</h1>
<div id="banner" class="banner err" role="alert" hidden><span id="banner-text"></span></div>
<form id="signup_form" data-signup-form data-captive-signup data-otp-required="1" action="https://api.nister.org/hotspot/signup.php" data-api-path="/hotspot/signup.php" method="post" target="_top">
<label for="name">Full name</label><input id="name" name="name" class="input" autocomplete="name" minlength="2" maxlength="80" required>
<label for="user">Ghana phone number</label><input id="user" name="username" class="input" type="tel" inputmode="tel" autocomplete="tel" placeholder="0241234567" maxlength="24" required>

<fieldset id="otp_fields"><legend>Verify your number</legend><button class="signup-secondary" id="otp_send_btn" type="button">Send code</button><label class="small" for="otp_code">SMS verification code</label><div class="signup-otp"><input id="otp_code" class="input" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="6-digit code"><button class="signup-secondary" id="otp_verify_btn" type="button">Verify</button></div><p id="otp_status" class="signup-hint" role="status"></p></fieldset>
<label for="pass">Password (6+ characters)</label><div class="signup-password"><input id="pass" name="password" class="input" type="password" autocomplete="new-password" minlength="6" maxlength="128" required><button id="toggle_pass" type="button" aria-controls="pass" aria-pressed="false">Show</button></div>

<details class="signup-referral"><summary>Have a referral code?</summary><label for="referral_code">Referral code (optional)</label><input id="referral_code" name="referral_code" class="input" maxlength="32"></details>
<input type="hidden" id="mac" name="mac" value="$(mac)"><input type="hidden" id="dst" name="dst" value=""><input type="hidden" id="otp_token" name="otp_token" value=""><input type="hidden" id="location_code" name="location_code" value=""><input type="hidden" id="router_ip" name="router_ip" value="$(server-address)"><input type="hidden" id="router_id" name="router_id" value="$(identity)"><input type="hidden" name="link_login_only" value="$(link-login-only)"><input type="hidden" name="link_login" value="$(link-login)">
<div class="signup-trap" aria-hidden="true"><label for="contact_website">Leave empty</label><input id="contact_website" name="contact_website" tabindex="-1" autocomplete="off"></div>
<button class="btn btn-primary btn-full" type="submit">Create account</button><p class="signup-hint">Your account starts with a zero balance. Choose and pay for a plan to get online.</p></form>
<hr><div class="center small">Already have an account? <a class="link" href="login.html">Log in</a></div><div class="support"><a class="support-link" href="https://wa.me/233598544768" target="_blank" rel="noopener">WhatsApp support</a></div></div></div></body></html>
