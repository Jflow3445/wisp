<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NISTER Wi-Fi | Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="common.css">
  <style>
    .card{max-width:560px}
    .note-box{
      background:rgba(15,118,110,.08);
      border:1px solid rgba(15,118,110,.2);
      color:#0b3c36;
      border-radius:12px;
      padding:10px 12px;
      font-size:12px;
      margin:10px 0 14px;
    }
    .otp-row{display:flex;gap:8px;align-items:center}
    .otp-row .input{flex:1}
    .otp-status{font-size:12px;color:#0b3c36;margin:6px 0 0}
    .btn-mini{
      height:42px;
      padding:0 12px;
      border:1px solid rgba(15,118,110,.35);
      border-radius:10px;
      background:#fff;
      cursor:pointer;
      white-space:nowrap;
    }
    .btn-mini[disabled]{opacity:.6;cursor:not-allowed}
  </style>
  <script>
    function qs(k){ return new URLSearchParams(location.search).get(k) || ''; }
    function detectSiteCode(){
      var q = (qs('location_code') || qs('site_code') || '').trim();
      if (q) return q;
      if (typeof window !== 'undefined' && window.NISTER_SITE_CODE) {
        return String(window.NISTER_SITE_CODE).trim();
      }
      return '';
    }
    function showBanner(kind, text){
      var box = document.getElementById('banner');
      var span = document.getElementById('banner-text');
      if (!box || !span) return;
      box.className = 'banner ' + (kind === 'success' ? 'success' : 'err');
      span.textContent = text || '';
      box.style.display = text ? 'block' : 'none';
    }
    function resetErrorMessage(code){
      var c = (code || '').toLowerCase();
      if (!c) return '';
      if (c === 'account_not_found') return 'No account was found for this phone number.';
      if (c === 'invalid_phone') return 'Enter a valid phone number.';
      if (c === 'otp_not_requested') return 'Send an OTP code first.';
      if (c === 'otp_invalid') return 'The OTP code is not correct.';
      if (c === 'otp_expired') return 'OTP code has expired. Request a new one.';
      if (c === 'otp_locked') return 'Too many wrong OTP attempts. Request a new code.';
      if (c === 'cooldown_active') return 'Please wait before requesting another OTP.';
      if (c === 'rate_limited' || c === 'rate_limited_ip') return 'Too many OTP requests. Please try again shortly.';
      if (c === 'sms_send_failed') return 'OTP SMS could not be sent. Please try again.';
      if (c === 'invalid_code_format') return 'Enter a valid OTP code.';
      if (c === 'server_error') return 'We could not reset your password right now. Please try again later or contact support.';
      return code;
    }
    function apiUrl(path){
      var f = document.getElementById('reset_form');
      var action = f ? (f.action || f.getAttribute('action') || '') : '';
      if (action && /\/hotspot\/reset_password\.php(?:\?.*)?$/i.test(action)) {
        return action.replace(/\/hotspot\/reset_password\.php(?:\?.*)?$/i, path);
      }
      var m = action.match(/^(https?:\/\/[^\/]+)/i);
      var origin = m ? m[1] : location.origin;
      return origin.replace(/\/+$/,'') + path;
    }
    function setOtpStatus(text, ok){
      var el = document.getElementById('otp_status');
      if (!el) return;
      el.textContent = text || '';
      el.style.color = ok ? '#0b3c36' : '#7f1d1d';
    }
    function clearOtpToken(){
      var t = document.getElementById('otp_token');
      if (t) t.value = '';
      setOtpStatus('', true);
    }
    var otpTimer = null;
    function setCooldown(sec){
      var b = document.getElementById('otp_send_btn');
      if (!b) return;
      var left = Math.max(0, sec|0);
      if (otpTimer) { clearInterval(otpTimer); otpTimer = null; }
      if (left <= 0) {
        b.disabled = false;
        b.textContent = 'Send code';
        return;
      }
      b.disabled = true;
      b.textContent = 'Resend in ' + left + 's';
      otpTimer = setInterval(function(){
        left -= 1;
        if (left <= 0) {
          clearInterval(otpTimer); otpTimer = null;
          b.disabled = false;
          b.textContent = 'Send code';
          return;
        }
        b.textContent = 'Resend in ' + left + 's';
      }, 1000);
    }
    async function otpSend(){
      var user = document.getElementById('user');
      if (!user) return;
      var username = (user.value || '').trim();
      if (!username) { showBanner('err', 'Enter your phone number first.'); return; }
      clearOtpToken();
      setOtpStatus('', true);
      try {
        var r = await fetch(apiUrl('/hotspot/otp_send.php'), {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username: username, purpose: 'password_reset'})
        });
        var j = await r.json();
        if (!r.ok || !j.ok) {
          showBanner('err', resetErrorMessage(j.error || 'otp_send_failed'));
          if (j.cooldown_seconds) setCooldown(j.cooldown_seconds);
          return;
        }
        setCooldown(j.cooldown_seconds || 60);
        showBanner('success', 'OTP sent. Enter the code from your SMS and tap Verify.');
      } catch (e) {
        showBanner('err', 'Could not send OTP right now. Please try again.');
      }
    }
    async function otpVerify(){
      var user = document.getElementById('user');
      var code = document.getElementById('otp_code');
      var token = document.getElementById('otp_token');
      if (!user || !code || !token) return;
      var username = (user.value || '').trim();
      var otp = (code.value || '').trim();
      if (!username || !otp) { showBanner('err', 'Enter phone number and OTP code.'); return; }
      try {
        var r = await fetch(apiUrl('/hotspot/otp_verify.php'), {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username: username, code: otp})
        });
        var j = await r.json();
        if (!r.ok || !j.ok || !j.signup_token) {
          token.value = '';
          setOtpStatus('OTP verification failed.', false);
          showBanner('err', resetErrorMessage(j.error || 'otp_verify_failed'));
          return;
        }
        token.value = j.signup_token;
        setOtpStatus('Phone number verified.', true);
        showBanner('success', 'Phone number verified. Set your new password.');
      } catch (e) {
        token.value = '';
        setOtpStatus('OTP verification failed.', false);
        showBanner('err', 'Could not verify OTP right now. Please try again.');
      }
    }
    function bindToggle(btnId, inputId){
      var btn = document.getElementById(btnId);
      var input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener('click', function(){
        var isPass = input.type === 'password';
        input.type = isPass ? 'text' : 'password';
        btn.textContent = isPass ? 'Hide' : 'Show';
        btn.setAttribute('aria-pressed', isPass ? 'true' : 'false');
      });
    }
    function validateForm(ev){
      var token = document.getElementById('otp_token');
      var p1 = document.getElementById('pass');
      var p2 = document.getElementById('pass2');
      if (!token || !token.value) {
        ev.preventDefault();
        showBanner('err', 'Verify your phone with OTP before resetting your password.');
        return false;
      }
      if (!p1.value || p1.value.length < 6) {
        ev.preventDefault();
        showBanner('err', 'New password must be at least 6 characters.');
        p1.focus();
        return false;
      }
      if (p1.value !== p2.value) {
        ev.preventDefault();
        showBanner('err', 'Passwords do not match.');
        p2.focus();
        return false;
      }
      return true;
    }
    document.addEventListener('DOMContentLoaded', function(){
      var siteCode = detectSiteCode();
      var loginLink = document.getElementById('login_link');
      if (loginLink) {
        var href = 'login.html';
        if (siteCode) href += '?location_code=' + encodeURIComponent(siteCode);
        loginLink.setAttribute('href', href);
      }
      var user = document.getElementById('user');
      var preUser = qs('username');
      if (preUser && user) user.value = preUser;
      var mac = qs('mac') || '$(mac)';
      document.getElementById('mac').value = mac;
      document.getElementById('link_login_only').value = '$(link-login-only)';
      if (user) user.addEventListener('input', clearOtpToken);
      var sendBtn = document.getElementById('otp_send_btn');
      if (sendBtn) sendBtn.addEventListener('click', otpSend);
      var verifyBtn = document.getElementById('otp_verify_btn');
      if (verifyBtn) verifyBtn.addEventListener('click', otpVerify);
      bindToggle('toggle_pass', 'pass');
      bindToggle('toggle_pass2', 'pass2');
      var form = document.getElementById('reset_form');
      if (form) form.addEventListener('submit', validateForm);
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <div class="dot"></div>
        <div class="name">NISTER Wi-Fi</div>
        <span class="tag">reset</span>
      </div>
      <h2 class="h">Reset password</h2>
      <p class="sub">Use an SMS code to set a new Wi-Fi password.</p>

      <div id="banner" class="banner"><span id="banner-text"></span></div>
      <div class="note-box">Enter the phone number on your account. We will send a one-time code to that number.</div>

      <form id="reset_form" action="https://api.nister.org/hotspot/reset_password.php" data-api-path="/hotspot/reset_password.php" method="post" target="_top" autocomplete="off">
        <label class="small" for="user">Phone number *</label>
        <input id="user" name="username" class="input" inputmode="tel" autocomplete="username" placeholder="0240000000" required>
        <div style="height:8px"></div>
        <div class="otp-row">
          <button class="btn-mini" id="otp_send_btn" type="button">Send code</button>
        </div>
        <div style="height:10px"></div>

        <label class="small" for="otp_code">OTP code *</label>
        <div class="otp-row">
          <input id="otp_code" class="input" inputmode="numeric" placeholder="Enter 6-digit code">
          <button class="btn-mini" id="otp_verify_btn" type="button">Verify</button>
        </div>
        <div id="otp_status" class="otp-status"></div>
        <div style="height:10px"></div>

        <label class="small" for="pass">New password *</label>
        <div class="input-wrap">
          <input id="pass" name="password" class="input" type="password" autocomplete="new-password" required>
          <button class="toggle-btn" id="toggle_pass" type="button" aria-pressed="false">Show</button>
        </div>
        <div style="height:10px"></div>

        <label class="small" for="pass2">Confirm new password *</label>
        <div class="input-wrap">
          <input id="pass2" name="password2" class="input" type="password" autocomplete="new-password" required>
          <button class="toggle-btn" id="toggle_pass2" type="button" aria-pressed="false">Show</button>
        </div>
        <div style="height:16px"></div>

        <input type="hidden" id="otp_token" name="otp_token" value="">
        <input type="hidden" id="mac" name="mac" value="$(mac)">
        <input type="hidden" id="link_login_only" name="link_login_only" value="$(link-login-only)">

        <button class="btn btn-primary btn-full" type="submit">Reset password</button>
      </form>

      <hr>
      <div class="center small">Remembered it? <a class="link" id="login_link" href="login.html">Return to login</a></div>
      <div class="support">
        <a class="support-link" href="https://wa.me/233598544768" target="_blank" rel="noopener">WhatsApp support</a>
        <span class="note">Need help resetting? Chat with us.</span>
      </div>
      <div class="footer">Keep your password safe and do not share it.</div>
    </div>
  </div>
</body>
<script src="config.js"></script>
</html>
